name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
