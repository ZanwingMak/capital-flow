name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取代码
        uses: actions/checkout@v6
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网站文件
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: 等待上传文件索引
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          for attempt in {1..13}; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')
            if [ -n "$EXPECTED_ARTIFACT_ID" ] && [ "$artifact_id" = "$EXPECTED_ARTIFACT_ID" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 13 ]; then
              sleep 5
            fi
          done
          printf '%s\n' 'Pages artifact index did not become ready within 60 seconds.' >&2
          exit 1
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
